<!DOCTYPE html>
<html>
<head><title>Auto WebRTC</title></head>
<body>
<h2>Auto P2P Call</h2>
<input id="role" placeholder="Enter 'caller' or 'receiver'" style="width:200px">
<button id="start">Start</button>
<video id="local" autoplay muted playsinline style="width:300px"></video>
<video id="remote" autoplay playsinline style="width:300px"></video>
<div id="status">Enter role and click Start</div>

<script>
let ws, pc;

document.getElementById("start").onclick = async () => {
  const role = document.getElementById("role").value.trim();
  
  ws = new WebSocket("wss://webrtc-signaling.i771468.workers.dev");
  pc = new RTCPeerConnection({iceServers: [{urls: "stun:74.125.140.127:19302"}]});

  const stream = await navigator.mediaDevices.getUserMedia({audio: true, video: true});
  document.getElementById("local").srcObject = stream;
  stream.getTracks().forEach(t => pc.addTrack(t, stream));

  pc.ontrack = e => document.getElementById("remote").srcObject = e.streams[0];
  pc.onicecandidate = e => e.candidate && ws.send(JSON.stringify({ice: e.candidate}));
  pc.oniceconnectionstatechange = () => document.getElementById("status").textContent = pc.iceConnectionState;

  ws.onmessage = async e => {
    const msg = JSON.parse(e.data);
    if (msg.offer) {
      await pc.setRemoteDescription(msg.offer);
      await pc.setLocalDescription(await pc.createAnswer());
      ws.send(JSON.stringify({answer: pc.localDescription}));
    } else if (msg.answer) {
      await pc.setRemoteDescription(msg.answer);
    } else if (msg.ice) {
      await pc.addIceCandidate(msg.ice);
    }
  };

  ws.onopen = async () => {
    if (role === "caller") {
      await pc.setLocalDescription(await pc.createOffer());
      ws.send(JSON.stringify({offer: pc.localDescription}));
      document.getElementById("status").textContent = "Calling...";
    } else {
      document.getElementById("status").textContent = "Waiting for call...";
    }
  };
};
</script>
</body>
</html>
